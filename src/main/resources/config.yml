# Las actualizaciones las administra DrakesCraft mediante CI.
auto-update: false

# Añade los avances personalizados al menú de avances de Minecraft (experimental).
use-advancements-api: true

# Anuncia en el chat los avances completados.
announce-advancements: true

# Añade un acceso a los avances dentro de la guía de Slimefun.
add-advancements-to-guide: true

# Activa mensajes de diagnóstico en consola.
debug: false

# Recarga los datos de Bukkit al eliminar un avance; puede provocar una pausa breve.
reload-data-on-adv-remove: true
